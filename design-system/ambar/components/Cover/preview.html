<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><style>
body{margin:0}
.cv{position:relative;width:960px;height:300px;background:var(--negro);overflow:hidden}
svg{position:absolute;inset:0}
.vino{fill:var(--vino)}.fuego{fill:var(--fuego)}.ambar{fill:var(--ambar)}.taupe{fill:var(--taupe)}
.ring{fill:none;stroke:var(--perla);stroke-width:1}.dot{fill:var(--perla)}
.tx{position:absolute;left:40px;bottom:40px;width:440px}
.nm{font-family:var(--font-serif);font-weight:300;font-size:64px;line-height:.95;color:var(--perla)}
.tg{font-family:var(--font-sans);font-size:13px;color:var(--perla-suave);margin-top:16px}
</style></head><body><div class="cv">
<!-- blocks: vino 240x300, fuego 176x200, ambar 64x100, taupe 64x64 (multiples of space-2/space-3; radius-0)
     arrangement: one tall vino slab with satellites, bleeding off top and right, the way posts crop to the edge
     pattern: literal motif — the brand's benefit ring (1px perla circle with eight dots, radius-full) crossing slab and fuego block
     steps/radii: space-3 16, space-5 40, space-6 64; radius-0 blocks, radius-full dots -->
<svg viewBox="0 0 960 300"><rect class="vino" x="544" y="0" width="240" height="300"/><rect class="fuego" x="784" y="0" width="176" height="200"/><rect class="ambar" x="784" y="200" width="64" height="100"/><rect class="taupe" x="896" y="236" width="64" height="64"/>
<circle class="ring" cx="752" cy="150" r="104"/><g class="dot"><circle cx="752" cy="46" r="3"/><circle cx="825.5" cy="76.5" r="3"/><circle cx="856" cy="150" r="3"/><circle cx="825.5" cy="223.5" r="3"/><circle cx="752" cy="254" r="3"/><circle cx="678.5" cy="223.5" r="3"/><circle cx="648" cy="150" r="3"/><circle cx="678.5" cy="76.5" r="3"/></g></svg>
<div class="tx"><div class="nm">Ámbar Sculpt<br>Studio</div><div class="tg">Enciende tu fuego, esculpe tu fuerza.</div></div>
</div></body></html>
